# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven - verify

on:
  push:
    branches:
      - main
      - chore/*
      - feature/*
      - develop
  pull_request:
    branches:
      - main

jobs:
  verify:

    runs-on: ubuntu-latest

    steps:
      - shell: bash
        env:
          VERIFY_SECRET: ${{ secrets.FOO_BAR }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PHANTOM_SECRET: ${{ secrets.PHANTOM_SECRET }}
        run: |
          echo "DEBUG VERIFY_SECRET $VERIFY_SECRET"
          if [[  "$VERIFY_SECRET" == "wumpus" ]]
          then
            echo "DEBUG secret passed"
          else
            echo "DEBUG secret mismatch"
          fi

          if [[ -n "$SONATYPE_PASSWORD" ]]
          then
            echo "DEBUG have SONATYPE_PASSWORD"
          fi

          if [[ -n "$SONATYPE_USERNAME" ]]
          then
            echo "DEBUG have SONATYPE_USERNAME"
          fi

          if [[ -n "$PHANTOM_SECRET" ]]
          then
            echo "DEBUG have PHANTOM_SECRET"
          else
            echo "DEBUG PHANTOM_SECRET not defined"
          fi

  tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Check Maven version
        run: mvn --version
      - name: Run tests
        run: mvn test
      - name: Lint
        run: mvn checkstyle:checkstyle
